name: Mirror latest release to R2

# Receives one repository_dispatch only after an allowlisted publisher has
# uploaded every named asset to its GitHub release. GitHub releases/latest is
# checked before upload and immediately before promotion. This per-repo Actions
# concurrency group is the supported single-writer path; it is not a general
# storage CAS fence. GitHub may retain only one pending run, so every run also
# revalidates official latest before it can switch state. If GitHub discards a
# newer pending dispatch, the source release owner must visibly re-send current
# latest; this workflow has no scheduler or background reconciler.
on:
  repository_dispatch:
    types: [release-asset-published]

permissions:
  contents: read

concurrency:
  group: mirror-release-assets-${{ github.event.client_payload.source_repo }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_MIRROR_BUCKET: ${{ vars.RELEASE_MIRROR_BUCKET }}
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      TAG: ${{ github.event.client_payload.tag }}
      ASSETS_JSON: ${{ toJson(github.event.client_payload.assets) }}
      # Workflow context is authoritative. client_payload cannot choose a key
      # generation and therefore cannot overwrite the active generation.
      GENERATION: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate payload and synchronize latest release
        run: node scripts/sync-latest-release.mjs
