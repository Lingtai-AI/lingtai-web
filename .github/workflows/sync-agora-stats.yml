name: Sync agora stats

on:
  schedule:
    # Every 6 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agora-data'
      - 'scripts/sync-agora-stats.mjs'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # We commit directly to main, so use the default token; cron pushes
          # land without triggering further workflows (intentional).
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yaml parser
        run: npm install yaml --no-save

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-agora-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet agora-stats.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agora-stats.json
          git commit -m "agora: refresh stats"
          git push
